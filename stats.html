<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore for 1 941 420 Geometry Dash levels"/>
    <title>GDLS</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="table.css">

</head>
<body>
    
    <div class="centered">
        <h1>Levels statistics</h1>
    </div>

    <div>
      <p>Key</p>
      <select id="key" class="key-inp">
          <option value="name">Name</option>
          <option value="description">Description</option>
          <option value="author">Author</option>
          <option value="difficulty">Difficulty</option>
          <option value="downloads">Downloads</option>
          <option value="likes">Likes</option>
          <option value="length">Length</option>
          <option value="platformer">Platformer</option>
          <option value="stars">Stars</option>
          <option value="gameVersion">Game version</option>
          <option value="version">Version</option>
          <option value="copiedID">Copied ID</option>
          <option value="twoPlayer">Two player</option>
          <option value="officialSong">Official song ID</option>
          <option value="customSong">Custom song ID</option>
          <option value="coins">Coins</option>
          <option value="verifiedCoins">Verified coins</option>
          <option value="starsRequested">Stars requested</option>
          <option value="objects">Objects</option>
          <option value="cp">Rating</option>
          <option value="songName">Song name</option>
          <option value="songAuthor">Song author</option>
          <option value="songSize">Song size</option>
          <option value="songID">Song ID</option>
          <option value="uploadGameVersion">Upload game version</option>
      </select> <br>
      <p>Sort by</p>
      <select id="sortby" class="key-inp">
          <option value="value">Value</option>
          <option value="alphabet">Alphabet</option>
          <option value="length">Length</option>
      </select> <br>

      <p>Split by</p>
      <select id="splitby" class="key-inp">
          <option value="nosplit">No split</option>
          <option value="sentences">Sentences (.!?)</option>
          <option value="words">Words ( ,.!?())</option>
          <option value="raw-words">Raw words ( )</option>
          <option value="symbols">Symbols</option>
      </select> <br>

      <br>
      <input type="checkbox" class="checkbox" id="reverse-inp" checked> <label class="checkbox-label">Reverse</label> 
      <input type="checkbox" class="checkbox" id="length-inp" checked> <label class="checkbox-label">Use length</label>

      <br> <button onclick="start()">Start</button><br><br><br><br>
    </div>

    <div id="result-container" style="font-family: Arial, Helvetica, sans-serif;"></div>

    <footer>
        <div class="footer-content">
            <strong>Other pages</strong><br>
            <p><a href="index.html">Main page</a> · <a href="search.html">Level search</a> · <a href="fun.html">Fun</a> · <a href="unlisted.html">Unlisted levels finder</a></p>
        </div>
    </footer>

    <script src="load_data.js"></script>
    <script src="stats.js"></script>

</body>
</html>
