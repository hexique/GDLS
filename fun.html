<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore for 1.9 million Geometry Dash levels"/>
    <title>GDLS | Fun</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="centered">
        <h1>Fun</h1>

        <div id="randomlvl-container"></div>

        <input id="lvlId-inp" placeholder="ID"><br><br>
        <button onclick="getLvlById(parseInt(document.getElementById('lvlId-inp').value))">Get level by ID</button>
        <button onclick="fetchRandomLvl()">Get random level</button>
        <div id="lvlbyid-container"></div>

        <h2>Fetch levels</h2>
        <p>From <input placeholder="ID" id="fetchLvlsMin-inp"></p>
        <p>To <input placeholder="ID" id="fetchLvlsMax-inp"></p><br>
        <select id="type-inp">
            <option value="index">Position</option>
            <option value="id">ID</option>
        </select>
        <br><button onclick="fetchLevels()">Fetch</button>
    </div>
    <div id="fetchedlvls-container"></div>

    <footer>
        <div class="footer-content">
            <strong>Other pages</strong><br>
            <p><a href="index.html">Main page</a> · <a href="search.html">Level search</a> · <a href="stats.html">Statistics</a> · <a href="unlisted.html">Unlisted level finder</a></p>
        </div>
    </footer>

    <script src="load_data.js"></script>
    <script src="fun.js"></script>

</body>
</html>
